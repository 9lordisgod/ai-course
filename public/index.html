<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SI Academy — K–12 AI Literacy</title>
    <meta name="description" content="SI Academy (Super Intelligence Academy): open-source K–12 AI literacy courses aligned with Canada's National AI Literacy Initiative, with ElevenLabs voice-over, mastery points and a Teacher Hub." />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-title" content="SI Academy" />
    <meta name="application-name" content="SI Academy" />
    <meta property="og:title" content="SI Academy — Learn how AI really works. Then teach it." />
    <meta property="og:description" content="Ready-to-teach K–12 AI literacy modules with ElevenLabs narration, practice quizzes, mastery points and teacher tools. Open source, privacy-first." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css?v=dev" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved !== "dark" && saved !== "light") saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = saved;
        } catch (e) {}
      })();
      // Optional: point a static deployment (e.g. GitHub Pages) at a hosted TTS API.
      // `build` and the `?v=` stamps on asset URLs are replaced with the commit SHA by pages.yml
      // so every deploy busts browser caches and an open tab can detect a newer build.
      window.SI_CONFIG = { apiBase: "", build: "dev" };
    </script>
  </head>
  <body>
    <a class="skip" href="#app">Skip to content</a>
    <header id="chrome"></header>
    <main id="app" tabindex="-1"><div class="loading">Loading SI Academy…</div></main>
    <footer id="footer"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="assets/app.js?v=dev" defer></script>
  </body>
</html>
